{% load static %}
<nav aria-label="Breadcrumb" class="breadcrumbs">
    <ol class="breadcrumb-list">
        {% for breadcrumb in breadcrumbs %}
            <li class="breadcrumb-item {% if breadcrumb.is_active %}active{% endif %}">
                {% if not breadcrumb.is_active and not forloop.last %}
                    <a href="{{ breadcrumb.url }}">{{ breadcrumb.name }}</a>
                    <span class="breadcrumb-separator" aria-hidden="true">/</span>
                {% else %}
                    <span aria-current="page">{{ breadcrumb.name }}</span>
                {% endif %}
            </li>
        {% endfor %}
    </ol>
</nav>

<style>
.breadcrumbs {
    padding: 1rem 0;
    margin-bottom: 2rem;
}

.breadcrumb-list {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    list-style: none;
    padding: 0;
    margin: 0;
    gap: 0.5rem;
}

.breadcrumb-item {
    display: flex;
    align-items: center;
    font-size: 0.9rem;
}

.breadcrumb-item a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    transition: color 0.2s ease;
}

.breadcrumb-item a:hover {
    color: #66AAFF;
}

.breadcrumb-item.active span {
    color: #ffffff;
    font-weight: 500;
}

.breadcrumb-separator {
    color: rgba(255, 255, 255, 0.4);
    margin: 0 0.5rem;
}

@media (max-width: 768px) {
    .breadcrumbs {
        padding: 0.75rem 0;
        margin-bottom: 1.5rem;
    }
    
    .breadcrumb-item {
        font-size: 0.85rem;
    }
}
</style>
