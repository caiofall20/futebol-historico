{% load static %}
{% comment %}
Template para Google AdSense
Adicione este template no base.html usando: {% include 'blog/adsense.html' %}
Configure ADSENSE_CLIENT_ID no .env após aprovação do AdSense
{% endcomment %}

{% if not request.user.is_authenticated and ADSENSE_CLIENT_ID %}
    <!-- Google AdSense Auto Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ ADSENSE_CLIENT_ID }}"
         crossorigin="anonymous"></script>

    <!-- Banner Superior (após scroll) -->
    <div class="ads-container ads-top" id="adsTop" style="display: none; margin: 1rem auto; text-align: center; max-width: 728px;">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="{{ ADSENSE_CLIENT_ID }}"
             data-ad-slot="1234567890"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <script>
    // Mostrar banner após scroll (não intrusivo)
    window.addEventListener('scroll', function() {
        if (window.scrollY > 500 && !localStorage.getItem('adsDismissed')) {
            const adsTop = document.getElementById('adsTop');
            if (adsTop) {
                adsTop.style.display = 'block';
            }
        }
    });
    </script>
{% endif %}
